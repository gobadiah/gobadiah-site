name: Deploy to GitHub Pages

# Publishes this static site to GitHub Pages at apps.gobadiah.com.
# One-time setup:
#   1. repo Settings → Pages → Build and deployment → Source: "GitHub Actions"
#   2. repo Settings → Pages → Custom domain: apps.gobadiah.com
#   3. DNS: add a CNAME record  apps → gobadiah.github.io  on gobadiah.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
